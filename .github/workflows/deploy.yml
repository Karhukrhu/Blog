name: Deploy to Nekoweb

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build Eleventy site
        run: npm run build

      - name: Deploy to Nekoweb
        uses: mp-pinheiro/nekoweb-deploy@0.3.0
        with:
          API_KEY: ${{ secrets.NEKOWEB_API_KEY }}
          BUILD_DIR: './_site'
          DEPLOY_DIR: '/karhukarhu.nekoweb.org/blog'  # <-- NO trailing slash here!
          CLEANUP: 'True'
          DELAY: '1.5'                                # <-- Keeps it from getting 429 errors
          DELAY: '3'                    # Wait 3 full seconds between EVERY file
          RETRY_ATTEMPTS: '10'          # Try up to 10 times if it gets blocked
          RETRY_DELAY: '2'              # Wait 2 seconds between retries
          RETRY_EXP_BACKOFF: 'True'     # Double the wait time each time it gets blocked
          NEKOWEB_PAGENAME: 'karhukarhu'
